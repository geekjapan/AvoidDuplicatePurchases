name: Publish GitHub Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact tag for the approved candidate
        required: true
        type: string
      candidate_run_id:
        description: Successful Release candidate workflow run ID
        required: true
        type: string
      manual_smoke_test:
        description: Confirm the Chrome Desktop manual smoke test passed
        required: true
        type: choice
        options:
          - PASS
          - NOT_RUN

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      MANUAL_SMOKE_TEST: ${{ inputs.manual_smoke_test }}
    steps:
      - name: Check out exact tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Download specified Release candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.tag }}
          path: ${{ runner.temp }}/adp-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}

      - name: Verify candidate and release gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          candidate_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          test "$(jq -r '.name' <<<"$candidate_run_json")" = "Release candidate"
          test "$(jq -r '.path' <<<"$candidate_run_json")" = ".github/workflows/release-candidate.yml"
          test "$(jq -r '.status' <<<"$candidate_run_json")" = completed
          test "$(jq -r '.conclusion' <<<"$candidate_run_json")" = success
          test "$(jq -r '.head_sha' <<<"$candidate_run_json")" = "$(git rev-parse HEAD)"
          node scripts/release.mjs verify-candidate \
            --dir "${RUNNER_TEMP}/adp-candidate" \
            --tag "$RELEASE_TAG" \
            --run-id "$CANDIDATE_RUN_ID"
          test "$MANUAL_SMOKE_TEST" = PASS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Generate Release notes
        run: |
          node scripts/release.mjs release-notes \
            --dir "${RUNNER_TEMP}/adp-candidate" \
            --tag "$RELEASE_TAG" \
            --run-id "$CANDIDATE_RUN_ID" \
            --manual-smoke "$MANUAL_SMOKE_TEST" \
            --output "${RUNNER_TEMP}/release-notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "${RUNNER_TEMP}/adp-candidate/avoid-duplicate-purchases-${RELEASE_TAG}.zip" \
            "${RUNNER_TEMP}/adp-candidate/SHA256SUMS" \
            "${RUNNER_TEMP}/adp-candidate/RELEASE.json" \
            --verify-tag \
            --title "AvoidDuplicatePurchases ${RELEASE_TAG#v}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
